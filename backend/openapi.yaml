openapi: 3.0.3
info:
  title: Arcoins API - Billetera Digital Multidivisa
  description: |
    API REST para la gestión de billetera digital multidivisa (**Arcoins Wallet**).
    
    Permite autenticación de usuarios, administración de saldos en COP, USD y EUR, 
    conversión y compra/venta de divisas en tiempo real, registro de movimientos, 
    pagos a comercios y un asistente financiero virtual impulsado por IA.

    ### Autenticación
    La mayoría de los endpoints bajo `/api` requieren un token JWT.
    Envía el token en la cabecera HTTP:
    ```
    Authorization: Bearer <tu_token_jwt>
    ```
  version: 1.0.0
  contact:
    name: Equipo Arcoins Wallet
servers:
  - url: https://arcoins-wallet.onrender.com
    description: Servidor de Producción (Render)
  - url: http://localhost:3000
    description: Servidor Local (Desarrollo)

tags:
  - name: General
    description: Verificación y estado del servicio
  - name: Autenticación
    description: Registro, inicio de sesión y perfil de usuario
  - name: Billetera
    description: Consulta de billetera y saldos multidivisa
  - name: Operaciones Financieras
    description: Depósitos, conversiones, tasas de cambio y transacciones
  - name: Comercios
    description: Listado de comercios habilitados para pagos
  - name: Asistente Virtual
    description: Asistencia financiera y consultas mediante Inteligencia Artificial

paths:
  /:
    get:
      tags:
        - General
      summary: Comprobar estado de la API (Healthcheck)
      description: Retorna un mensaje indicando que el servidor de la API está en ejecución.
      responses:
        "200":
          description: Servidor funcionando correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Arcoins Backend Running successfully 🚀

  /api/auth/register:
    post:
      tags:
        - Autenticación
      summary: Registro de un nuevo usuario
      description: Registra una nueva cuenta de usuario, inicializa su billetera y sus saldos en 0 para COP, USD y EUR, y devuelve un token JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDto"
      responses:
        "201":
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Datos de entrada inválidos o faltantes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                campos_faltantes:
                  value:
                    error: Todos los campos son requeridos (nombre, apellido, email, contraseña)
                email_invalido:
                  value:
                    error: El formato del correo electrónico no es válido
                password_corta:
                  value:
                    error: La contraseña debe tener al menos 8 caracteres
        "409":
          description: El correo electrónico ya se encuentra registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: El correo electrónico ya se encuentra registrado
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      tags:
        - Autenticación
      summary: Inicio de sesión de usuario
      description: Valida las credenciales del usuario y genera un token JWT firmado para autenticar futuras solicitudes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Faltan credenciales requeridas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: El correo electrónico y la contraseña son requeridos
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Credenciales inválidas
        "403":
          description: Cuenta inactiva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: La cuenta se encuentra inactiva. Contacte al soporte.
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/me:
    get:
      tags:
        - Autenticación
      summary: Obtener perfil del usuario autenticado
      description: Retorna la información básica del usuario que corresponde al token JWT enviado en la cabecera.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Datos del perfil de usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserResponse"
        "401":
          description: No autorizado o token inválido/expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Token inválido o expirado
        "403":
          description: Cuenta inactiva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno al consultar el perfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/wallet:
    get:
      tags:
        - Billetera
      summary: Obtener identificador de la billetera
      description: Retorna el identificador único (ID) de la billetera perteneciente al usuario autenticado.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Identificador de la billetera obtenido exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        "401":
          description: Usuario no autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"
        "404":
          description: Billetera no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"
              example:
                success: false
                error: Billetera no encontrada
        "500":
          description: Error al consultar la billetera
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"

  /api/wallet/balances:
    get:
      tags:
        - Billetera
      summary: Consultar todos los saldos de la billetera
      description: Devuelve el listado de saldos actuales disponibles en cada una de las divisas configuradas para la billetera del usuario.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Listado de saldos por divisa
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CurrencyBalance"
              example:
                data:
                  - currency: COP
                    amount: 250000.5
                  - currency: USD
                    amount: 120
                  - currency: EUR
                    amount: 50
        "401":
          description: Usuario no autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"
        "404":
          description: Billetera no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"
        "500":
          description: Error interno al consultar saldos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"

  /api/balance/{walletId}/{currency}:
    get:
      tags:
        - Billetera
      summary: Consultar saldo por ID de billetera y código de divisa
      description: Retorna el saldo disponible para una moneda puntual en una billetera específica.
      security:
        - bearerAuth: []
      parameters:
        - name: walletId
          in: path
          required: true
          description: UUID de la billetera a consultar
          schema:
            type: string
            format: uuid
            example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        - name: currency
          in: path
          required: true
          description: Código de la divisa (COP, USD, EUR)
          schema:
            type: string
            example: USD
      responses:
        "200":
          description: Consulta exitosa del saldo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  walletId:
                    type: string
                    example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currency:
                    type: string
                    example: USD
                  balance:
                    type: number
                    example: 150.75
        "400":
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"
        "401":
          description: Token no provisto o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/rates:
    get:
      tags:
        - Operaciones Financieras
      summary: Obtener cotización / tasa de cambio
      description: Consulta la tasa de cambio vigente entre dos divisas. Utiliza la API de ExchangeRate con respaldo de la última cotización almacenada en base de datos.
      parameters:
        - name: base
          in: query
          required: false
          description: Moneda de origen (3 letras)
          schema:
            type: string
            default: USD
            example: USD
        - name: target
          in: query
          required: false
          description: Moneda de destino (3 letras)
          schema:
            type: string
            default: COP
            example: COP
      responses:
        "200":
          description: Tasa de cambio obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"
        "400":
          description: Los códigos de moneda deben tener exactamente 3 letras
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"
              example:
                success: false
                error: Los códigos de moneda deben tener 3 letras
        "503":
          description: Servicio no disponible o sin tasas registradas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"
        "500":
          description: Error al consultar tasas de cambio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"

  /api/deposit:
    post:
      tags:
        - Operaciones Financieras
      summary: Realizar depósito de dinero en cuenta
      description: Acredita saldo a la billetera del usuario en la divisa solicitada e inserta una transacción de tipo `deposit`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositDto"
      responses:
        "201":
          description: Depósito realizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  transaction:
                    $ref: "#/components/schemas/Transaction"
        "400":
          description: Datos de depósito inválidos o monto negativo/cero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"
        "401":
          description: Usuario no autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"

  /api/transactions:
    get:
      tags:
        - Operaciones Financieras
      summary: Historial de transacciones del usuario
      description: Retorna el historial de movimientos paginado del usuario autenticado, permitiendo filtrar por tipo de operación, moneda y rango de fechas.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          description: Tipo de transacción a filtrar
          schema:
            type: string
            enum: [deposit, buy, sell, exchange, transfer_out, transfer_in, payment]
        - name: currency
          in: query
          required: false
          description: Código de moneda involucrada
          schema:
            type: string
            example: USD
        - name: from
          in: query
          required: false
          description: Fecha inicial de filtro (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: 2026-10-01
        - name: to
          in: query
          required: false
          description: Fecha final de filtro (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: 2026-10-19
        - name: page
          in: query
          required: false
          description: Número de página (10 registros por página)
          schema:
            type: integer
            default: 1
            example: 1
      responses:
        "200":
          description: Lista paginada de transacciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PaginatedTransactions"
        "400":
          description: Parámetros de filtro inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"
        "401":
          description: Usuario no autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"

    post:
      tags:
        - Operaciones Financieras
      summary: Crear operación de compra, venta o intercambio de divisas
      description: Procesa una conversión de monedas calculando la tasa de cambio vigente, deduciendo el saldo origen e incrementando el saldo destino en una transacción atómica.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionDto"
      responses:
        "200":
          description: Conversión realizada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: "#/components/schemas/Transaction"
        "400":
          description: Tipo inválido, fondos insuficientes o payload erróneo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"
              examples:
                fondos_insuficientes:
                  value:
                    success: false
                    error: Fondos insuficientes para completar la transacción.
                tipo_invalido:
                  value:
                    success: false
                    error: Tipo de transacción inválida
        "401":
          description: Usuario no autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"

  /api/payments:
    post:
      tags:
        - Operaciones Financieras
      summary: Realizar pago a un comercio
      description: Ejecuta un débito del saldo del usuario en la moneda seleccionada y transfiere el monto como pago al comercio indicado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentDto"
      responses:
        "201":
          description: Pago al comercio procesado con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: "#/components/schemas/Transaction"
        "400":
          description: Faltan campos requeridos o fondos insuficientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"
              examples:
                faltan_campos:
                  value:
                    success: false
                    error: Faltan campos obligatorios para el pago.
                saldo_insuficiente:
                  value:
                    success: false
                    error: Fondos insuficientes para completar la transacción.
        "401":
          description: Usuario no autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"

  /api/merchants:
    get:
      tags:
        - Comercios
      summary: Listar comercios disponibles
      description: Obtiene la lista de comercios activos asociados a la plataforma para efectuar pagos.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de comercios activos obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Merchant"
              example:
                data:
                  - id: b190220e-8f2e-4b68-b80c-255d6cbbf76c
                    name: Supermercado Central
                    category: Supermercados
                  - id: d490220e-8f2e-4b68-b80c-255d6cbbf77d
                    name: Librería El Saber
                    category: Educación
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error al consultar comercios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSuccessResponse"

  /api/chat:
    post:
      tags:
        - Asistente Virtual
      summary: Conversar con el Asistente Financiero IA
      description: |
        Envía una consulta al asistente virtual con tecnología Google Gemini para recibir orientación sobre el uso de la billetera y educación financiera.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequestDto"
      responses:
        "200":
          description: Respuesta generada por el asistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponseDto"
              example:
                reply: Una billetera digital permite gestionar saldos y movimientos en distintas monedas con seguridad.
        "400":
          description: Mensaje inválido o vacío
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: El mensaje debe ser un texto de hasta 2000 caracteres.
        "401":
          description: Autenticación ausente, inválida o expirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Fallo o respuesta vacía del proveedor de IA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: No se pudo obtener una respuesta del asistente. Intenta de nuevo.
        "503":
          description: Configuración del asistente ausente o inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Tiempo de espera agotado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error inesperado del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido mediante `/api/auth/login` o `/api/auth/register`. Formato `Bearer <token>`.

  schemas:
    RegisterDto:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
          example: Juan
        lastName:
          type: string
          example: Pérez
        email:
          type: string
          format: email
          example: juan.perez@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: Password123!
          description: Debe tener al menos 8 caracteres, una mayúscula, una minúscula y un número o símbolo.
        confirmPassword:
          type: string
          format: password
          minLength: 8
          example: Password123!
          description: Debe coincidir con el campo password.

    LoginDto:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: juan.perez@example.com
        password:
          type: string
          format: password
          example: secreto123

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: e4b281f6-d716-43d9-ba86-f698bc01ab12
        firstName:
          type: string
          example: Juan
        lastName:
          type: string
          example: Pérez
        email:
          type: string
          format: email
          example: juan.perez@example.com

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/UserResponse"

    CurrencyBalance:
      type: object
      properties:
        currency:
          type: string
          example: USD
        amount:
          type: number
          example: 1500.25

    ExchangeRateResponse:
      type: object
      properties:
        base:
          type: string
          example: USD
        target:
          type: string
          example: COP
        rate:
          type: number
          example: 4210.5
        fetchedAt:
          type: string
          example: Mon, 19 Oct 2026 18:00:00 +0000

    DepositDto:
      type: object
      required:
        - to_currency
        - to_amount
      properties:
        to_currency:
          type: string
          description: Código de la moneda a depositar (COP, USD, EUR)
          example: USD
        to_amount:
          type: number
          minimum: 0.01
          description: Monto a acreditar
          example: 100.0
        description:
          type: string
          description: Detalle o motivo del depósito
          example: Depósito inicial por transferencia

    CreateTransactionDto:
      type: object
      required:
        - type
        - fromCurrency
        - toCurrency
        - fromAmount
      properties:
        type:
          type: string
          enum: [buy, sell, exchange]
          description: Operación de conversión
          example: exchange
        fromCurrency:
          type: string
          description: Moneda de origen que se debita
          example: USD
        toCurrency:
          type: string
          description: Moneda de destino que se acredita
          example: COP
        fromAmount:
          type: number
          minimum: 0.01
          description: Monto que se entrega
          example: 50.0

    PaymentDto:
      type: object
      required:
        - merchantId
        - currency
        - amount
      properties:
        merchantId:
          type: string
          format: uuid
          description: ID del comercio beneficiario
          example: b190220e-8f2e-4b68-b80c-255d6cbbf76c
        currency:
          type: string
          description: Moneda en la que se realiza el pago
          example: COP
        amount:
          type: number
          minimum: 0.01
          description: Monto a pagar
          example: 35000.0
        description:
          type: string
          description: Concepto o detalle del pago
          example: Compra de víveres en supermercado

    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 7b844ca1-7443-4dc8-a7ce-e0c2941ec59d
        type:
          type: string
          enum: [deposit, buy, sell, exchange, transfer_out, transfer_in, payment]
          example: exchange
        status:
          type: string
          enum: [pending, completed, failed]
          example: completed
        fromCurrency:
          type: string
          nullable: true
          example: USD
        toCurrency:
          type: string
          nullable: true
          example: COP
        fromAmount:
          type: number
          nullable: true
          example: 50.0
        toAmount:
          type: number
          nullable: true
          example: 210525.0
        rateUsed:
          type: number
          nullable: true
          example: 4210.5
        rateTimestamp:
          type: string
          format: date-time
          nullable: true
        description:
          type: string
          nullable: true
          example: EXCHANGE de USD a COP
        createdAt:
          type: string
          format: date-time
          example: 2026-10-19T21:10:00.000Z

    PaginatedTransactions:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        page:
          type: integer
          example: 1
        total:
          type: integer
          example: 25

    Merchant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: b190220e-8f2e-4b68-b80c-255d6cbbf76c
        name:
          type: string
          example: Supermercado Central
        category:
          type: string
          example: Supermercados

    ChatRequestDto:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Pregunta o consulta del usuario para el asistente
          example: ¿Cómo puedo organizar mis ahorros en diferentes monedas?

    ChatResponseDto:
      type: object
      properties:
        reply:
          type: string
          description: Texto de respuesta generado por el asistente virtual
          example: Para organizar tus ahorros en diferentes divisas, te sugiero separar fondos de emergencia en moneda local...

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Mensaje descriptivo del error

    ErrorSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Mensaje descriptivo del error
